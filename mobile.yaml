openapi: 3.0.3
info:
  title: Polonez & Eastore Loyalty Mobile API
  description: |
    Public REST API for the Polonez & Eastore loyalty mobile app.

    The API is separate from the cash-register/POS loyalty API. It covers app
    configuration, legal documents, phone OTP login/signup, profile lifecycle,
    digital loyalty card QR tokens, points history, and session management.

    All endpoints are registered on both URL prefixes:
    - canonical public prefix: `/api/v1/mobile/...`
    - Odoo-compatible prefix: `/odoo/api/v1/mobile/...`

    In this OpenAPI document paths use the canonical `/api/v1/mobile` prefix.
    Select a server ending with `/odoo` from the Servers dropdown when you need
    to call the Odoo-compatible route.
  version: 1.0.0
  contact:
    name: Mike Shumkov (Polonez.ie)
    email: mike.shumkov@polonez.ie

servers:
  - url: https://stage.odoo-stage.polonez.dev
    description: Staging server - canonical mobile prefix
  - url: https://stage.odoo-stage.polonez.dev/odoo
    description: Staging server - Odoo-compatible prefix
  - url: https://erp.polonez.ie
    description: Production server - canonical mobile prefix
  - url: https://erp.polonez.ie/odoo
    description: Production server - Odoo-compatible prefix
  - url: http://localhost:8069
    description: Local Odoo - canonical mobile prefix
  - url: http://localhost:8069/odoo
    description: Local Odoo - Odoo-compatible prefix

tags:
  - name: Mobile - Public
    description: Public app configuration and legal content.
  - name: Mobile - Auth
    description: OTP login/signup and mobile session lifecycle.
  - name: Mobile - Profile
    description: Authenticated customer profile lifecycle.
  - name: Mobile - Card
    description: Authenticated digital card, QR tokens, and points history.
  - name: Mobile - Vouchers
    description: Authenticated voucher listing, detail, and claiming.
  - name: Mobile - Offers
    description: Authenticated promotional campaigns, offers, banners, and media.
  - name: Mobile - Stores
    description: Authenticated store/map listing for the current country.

paths:
  /api/v1/mobile/config:
    get:
      tags:
        - Mobile - Public
      summary: Get public app configuration
      description: |
        Returns welcome-voucher display information, legal document versions,
        and dropdown options needed by the app before login.

        Scoped to the operating country via `?country=ie|ni` (default `ie`): the
        welcome voucher and legal versions are the selected country's, and the
        welcome amount is labelled in that country's currency (IE→EUR, NI→GBP).
      operationId: mobileGetConfig
      parameters:
        - $ref: '#/components/parameters/CountryQueryParam'
      responses:
        '200':
          description: Public app configuration.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MobileConfigResponse'
              example:
                welcome_voucher:
                  discount_cents: 500
                  min_purchase_cents: 2500
                  currency: EUR
                  label: "€5 off €25"
                legal:
                  terms:
                    version: "2026-06-draft"
                  privacy:
                    version: "2026-06-draft"
                countries:
                  - value: ireland
                    label: Ireland
                  - value: poland
                    label: Poland
                genders:
                  - value: male
                    label: Male
                  - value: female
                    label: Female
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/v1/mobile/legal/terms:
    get:
      tags:
        - Mobile - Public
      summary: Get Terms & Conditions
      description: |
        Returns the published Terms & Conditions for the operating country
        (`?country=ie|ni`, default `ie`).
      operationId: mobileGetTerms
      parameters:
        - $ref: '#/components/parameters/CountryQueryParam'
      responses:
        '200':
          description: Published Terms & Conditions document.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LegalDocument'
              example:
                doc_type: terms
                title: Polonez & Eastore Club — Terms & Conditions
                version: "2026-06-draft"
                body_html: "<div><h2>Terms & Conditions</h2><p>...</p></div>"
                updated_at: "2026-06-11T21:00:00Z"
        '404':
          $ref: '#/components/responses/LegalDocumentNotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/v1/mobile/legal/privacy:
    get:
      tags:
        - Mobile - Public
      summary: Get Privacy Policy
      description: |
        Returns the published Privacy Policy for the operating country
        (`?country=ie|ni`, default `ie`).
      operationId: mobileGetPrivacy
      parameters:
        - $ref: '#/components/parameters/CountryQueryParam'
      responses:
        '200':
          description: Published Privacy Policy document.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LegalDocument'
              example:
                doc_type: privacy
                title: Polonez & Eastore Club — Privacy Policy
                version: "2026-06-draft"
                body_html: "<div><h2>Privacy Policy</h2><p>...</p></div>"
                updated_at: "2026-06-11T21:00:00Z"
        '404':
          $ref: '#/components/responses/LegalDocumentNotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/v1/mobile/auth/otp/request:
    post:
      tags:
        - Mobile - Auth
      summary: Request phone OTP
      description: |
        Generates a 6-digit OTP for the phone number and dispatches it through
        the configured delivery provider. Phone is normalized to E.164 using
        `country` (`ie` => `+353`, `ni` => `+44`).

        On staging, the following test phones use fixed OTP `000000` and do not
        send SMS: `+353871234561` (`country=ie`, `phone=871234561`),
        `+442800000000` (`country=ni`, `phone=2800000000`),
        `+353870000000` (`country=ie`, `phone=870000000`).
      operationId: mobileRequestOtp
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OtpRequest'
            examples:
              ireland:
                summary: Irish mobile number
                value:
                  country: ie
                  phone: "879991001"
              northernIreland:
                summary: Northern Ireland number
                value:
                  country: ni
                  phone: "7700 900123"
      responses:
        '200':
          description: OTP created and delivery attempted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OtpRequestResponse'
              example:
                expires_in: 300
                retry_after: 60
        '400':
          $ref: '#/components/responses/BadRequest'
        '429':
          $ref: '#/components/responses/RateLimit'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailableError'

  /api/v1/mobile/auth/otp/verify:
    post:
      tags:
        - Mobile - Auth
      summary: Verify phone OTP
      description: |
        Verifies the 6-digit OTP.

        If the phone already belongs to a loyalty profile, the response is
        `status=authenticated` with a mobile Bearer session token.

        If the phone is unknown, the response is `status=signup_required` with
        a short-lived `signup_token`. The app must then call
        `/auth/signup/complete`.

        On staging, use code `000000` for these fixed-OTP test phones:
        `+353871234561`, `+442800000000`, `+353870000000`.

        A profile may hold only a limited number of active sessions (2 by
        default). Issuing a session beyond that limit revokes the least
        recently used one, so an older device receives HTTP 401 with error code
        `SESSION_REVOKED` on its next request and must return to the
        unauthenticated flow. Logging in again from the same `device_id`
        replaces that device's own session and never costs another device its
        slot, so a stable `device_id` across reinstalls matters.
      operationId: mobileVerifyOtp
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OtpVerifyRequest'
            example:
              country: ie
              phone: "879991001"
              code: "654321"
              device_id: "ios-device-uuid"
              platform: ios
              device_name: "Mike's iPhone"
              app_version: "1.0.0"
      responses:
        '200':
          description: Either authenticated session or signup required.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/AuthenticatedResponse'
                  - $ref: '#/components/schemas/SignupRequiredResponse'
              examples:
                authenticated:
                  value:
                    status: authenticated
                    token: "est_XI3ZmjHz0bnrybRr4uQGmBMlpPmAycGl3urc-opGdsA"
                    expires_at: "2027-06-11T21:43:39Z"
                    partner_id: 22
                    is_profile_complete: true
                signupRequired:
                  value:
                    status: signup_required
                    signup_token: "sst_9wK3s6vtE7r4m3Y8pQ"
                    signup_expires_in: 900
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/v1/mobile/auth/signup/complete:
    post:
      tags:
        - Mobile - Auth
      summary: Complete signup after OTP verification
      description: |
        Creates the partner/profile for an unknown phone after ownership was
        proven by `/auth/otp/verify`, consumes the signup token, and returns an
        authenticated mobile session. A personal welcome voucher (one per member
        per country) is granted on completion and appears in `GET /vouchers`.

        The operating country (`current_country`) is derived from the phone
        prefix (`+353` → `ie`, `+44` → `ni`); the welcome voucher is issued in
        that country. Switching to the other country later via `PUT /me/country`
        issues that country's welcome voucher too.
      operationId: mobileCompleteSignup
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignupCompleteRequest'
            example:
              signup_token: "sst_9wK3s6vtE7r4m3Y8pQ"
              first_name: Alexandra
              terms_accepted: true
              device_id: "android-device-uuid"
              platform: android
              device_name: "Pixel 9"
              app_version: "1.0.0"
      responses:
        '200':
          description: Signup completed and mobile session issued.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticatedResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/v1/mobile/auth/logout:
    post:
      tags:
        - Mobile - Auth
      summary: Revoke current mobile session
      operationId: mobileLogout
      security:
        - MobileBearerAuth: []
      responses:
        '200':
          description: Current session revoked or already gone.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LogoutResponse'
              example:
                revoked: true
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/v1/mobile/auth/sessions:
    get:
      tags:
        - Mobile - Auth
      summary: List active mobile sessions
      description: |
        Active, non-expired sessions of the current profile, the requesting one
        flagged with `is_current`. Never more than the active-session limit
        (2 by default) — see `/auth/otp/verify`.
      operationId: mobileListSessions
      security:
        - MobileBearerAuth: []
      responses:
        '200':
          description: Active non-expired sessions for the current profile.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionsResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/v1/mobile/auth/sessions/revoke-all:
    post:
      tags:
        - Mobile - Auth
      summary: Revoke all active sessions for current profile
      operationId: mobileRevokeAllSessions
      security:
        - MobileBearerAuth: []
      responses:
        '200':
          description: Number of sessions revoked.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RevokeAllSessionsResponse'
              example:
                revoked: 2
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/v1/mobile/me:
    get:
      tags:
        - Mobile - Profile
      summary: Get current profile
      description: >-
        Also refreshes the mobile session activity and sliding expiry; the app
        calls this endpoint on startup and resume.
      operationId: mobileGetMe
      security:
        - MobileBearerAuth: []
      responses:
        '200':
          description: Current authenticated profile.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
    patch:
      tags:
        - Mobile - Profile
      summary: Update current profile
      description: |
        Updates mutable profile fields. Unknown fields are rejected. Phone
        changes are not accepted here; changing phone must go through an OTP
        verification flow.
      operationId: mobilePatchMe
      security:
        - MobileBearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProfilePatchRequest'
            example:
              first_name: Alexandra
              last_name: Tester
              email: alexandra@example.com
              date_of_birth: "1990-01-11"
              country_of_origin: ireland
              gender: female
      responses:
        '200':
          description: Updated profile.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/v1/mobile/me/preferences/{application}:
    parameters:
      - name: application
        in: path
        required: true
        description: Mobile app whose account preferences are being managed.
        schema:
          $ref: '#/components/schemas/MobileApplication'
    get:
      tags:
        - Mobile - Profile
      summary: Get communication preferences
      description: |
        Returns account-level communication preferences for the selected app.
        Existing users without a stored row receive and persist the defaults:
        push enabled, email newsletter and SMS disabled. Values are shared
        between all devices and are independent for Eastore and Polonez.

        `push_notifications` is the account preference only. The app and push
        delivery service must separately check the target device's OS permission.
      operationId: mobileGetPreferences
      security:
        - MobileBearerAuth: []
      responses:
        '200':
          description: Current communication preferences.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PreferencesResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
    patch:
      tags:
        - Mobile - Profile
      summary: Update communication preferences
      description: |
        Atomically updates one or more booleans and returns the complete current
        state. Every effective field change is audited with the profile, app,
        old/new values, timestamp, current region, session device/platform, and
        API source. No-op values do not create audit rows.

        Enabling `email_newsletter` or `receive_sms` requires a fully verified
        profile. Disabling either channel remains allowed after verification is
        lost. Marketing senders must call the Odoo-side
        `loyalty.mobile.preference.communication_allowed()` gate immediately
        before delivery to re-check verification and the latest value. This addon
        does not currently implement marketing delivery; transactional OTP and
        email-verification messages intentionally bypass these preferences. At
        account anonymisation, current preferences are removed and device IDs are
        erased from retained consent history.
      operationId: mobilePatchPreferences
      security:
        - MobileBearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PreferencesPatchRequest'
            example:
              push_notifications: false
              email_newsletter: true
      responses:
        '200':
          description: Updated communication preferences.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PreferencesResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: Profile is not verified, so marketing email/SMS cannot be enabled.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                status: false
                error:
                  code: PROFILE_NOT_VERIFIED
                  message: A verified profile is required to enable email newsletter or SMS
                  details:
                    fields: [email_newsletter]
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/v1/mobile/me/country:
    put:
      tags:
        - Mobile - Profile
      summary: Switch operating country (IE/NI)
      description: |
        Switches the member's operating country between Ireland (`ie`) and
        Northern Ireland (`ni`). Points and vouchers are **not** transferred —
        each country has its own balance and voucher set; the app should refetch
        all country-scoped screens (card, vouchers, points history, legal) after
        switching. On the first switch to a country, that country's welcome
        voucher is issued if the member never received one there (one welcome per
        member per country); repeated switches never create duplicates. Returns
        the updated profile.
      operationId: mobileSetCountry
      security:
        - MobileBearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetCountryRequest'
            example:
              country: ni
      responses:
        '200':
          description: Updated profile with the new current country.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'
        '400':
          description: Invalid country value.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                status: false
                error:
                  code: INVALID_COUNTRY
                  message: country must be 'ie' or 'ni'
                  details:
                    field: country
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/v1/mobile/me/delete:
    post:
      tags:
        - Mobile - Profile
      summary: Request account deletion
      description: |
        Soft-deletes the loyalty profile and revokes all mobile sessions.
        Hard deletion is handled later by retention cleanup.
      operationId: mobileDeleteMe
      security:
        - MobileBearerAuth: []
      responses:
        '200':
          description: Account marked deleted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteProfileResponse'
              example:
                deleted: true
                deleted_at: "2026-06-11T21:43:39Z"
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/v1/mobile/me/email/request:
    post:
      tags:
        - Mobile - Profile
      summary: Request email verification code
      description: Sends a 6-digit code to the email currently saved on the profile.
      operationId: mobileRequestEmailVerification
      security:
        - MobileBearerAuth: []
      responses:
        '200':
          description: Email verification code created and delivery attempted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmailVerificationRequestResponse'
              example:
                expires_in: 86400
                retry_after: 60
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/RateLimit'
        '503':
          $ref: '#/components/responses/ServiceUnavailableError'

  /api/v1/mobile/me/email/verify:
    post:
      tags:
        - Mobile - Profile
      summary: Verify email code
      operationId: mobileVerifyEmail
      security:
        - MobileBearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailVerificationVerifyRequest'
            example:
              code: "123456"
      responses:
        '200':
          description: Email verification state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmailVerificationVerifyResponse'
              example:
                is_email_verified: true
                is_profile_complete: true
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/v1/mobile/me/card:
    get:
      tags:
        - Mobile - Card
      summary: Get digital loyalty card
      description: |
        Returns the member card code, points balance, and a pre-issued batch of
        daily QR payloads. QR tokens are tied to the current session device for
        audit.

        The `points_balance` and `currency` are for the member's current country;
        the `card_code` and QR set are country-independent (one identity). At the
        till the country is determined by the shop, not the QR.
      operationId: mobileGetCard
      security:
        - MobileBearerAuth: []
      responses:
        '200':
          description: Digital loyalty card.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CardResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/v1/mobile/me/points-history:
    get:
      tags:
        - Mobile - Card
      summary: Get points history
      description: |
        **Breaking change (SO20-3003):** the response is now
        `{items, next_cursor, has_more}` - previously `{transactions}` - and within
        a row `date` became `occurred_at` and the `store_name` string became a
        `store` object. The endpoint is not versioned, so an older client renders
        an empty list rather than an error.

        Wallet history for the member's current country, newest first: purchases,
        point conversions and manual adjustments. Wallets are isolated per
        country, so events from the other country are never included and
        switching country switches the whole history.

        One row per event. Everything about a visit stays inside its own row -
        points earned, vouchers spent, vouchers handed out - rather than being
        split across extra rows. Rows with `points: 0` are real: a basket too
        small to earn anything is still a visit.

        Paginated by an opaque cursor rather than an offset, because new rows
        arrive at the top while the member scrolls and an offset would then
        repeat or skip rows. Pass the previous response's `next_cursor` to load
        the next page; omit it to get the newest page (pull-to-refresh).

        History goes back two years.
      operationId: mobileGetPointsHistory
      security:
        - MobileBearerAuth: []
      parameters:
        - in: query
          name: limit
          required: false
          schema:
            type: integer
            default: 20
            minimum: 1
            maximum: 100
          description: Page size. Out-of-range values are clamped.
        - in: query
          name: cursor
          required: false
          schema:
            type: string
          description: |
            Opaque cursor from the previous response's `next_cursor`. Treat it as
            a black box - its contents are an implementation detail.
          example: "982"
      responses:
        '200':
          description: One page of wallet history, newest first.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PointsHistoryResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/v1/mobile/vouchers:
    get:
      tags:
        - Mobile - Vouchers
      summary: List my vouchers
      description: |
        Returns the member's vouchers, soonest-to-expire first. By default only
        usable vouchers (`Active` + `Issued`) are returned; pass `status` to
        widen into history. Optional `amount` (exact discount in cents) and `q`
        (substring over voucher description and code) filter the list.

        Scoped to the member's current country: only vouchers belonging to that
        country's programmes are returned (switch with `PUT /me/country`).
      operationId: mobileListVouchers
      security:
        - MobileBearerAuth: []
      parameters:
        - name: status
          in: query
          required: false
          description: >-
            Comma-separated statuses to include (active, issued, used, expired,
            revoked). Defaults to active,issued.
          schema:
            type: string
          example: active,issued
        - name: amount
          in: query
          required: false
          description: Exact voucher discount value in cents.
          schema:
            type: integer
          example: 500
        - name: q
          in: query
          required: false
          description: Case-insensitive substring search over voucher description and code.
          schema:
            type: string
      responses:
        '200':
          description: The member's vouchers.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VoucherListResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/v1/mobile/vouchers/{code}:
    get:
      tags:
        - Mobile - Vouchers
      summary: Get one of my vouchers
      operationId: mobileGetVoucher
      security:
        - MobileBearerAuth: []
      parameters:
        - name: code
          in: path
          required: true
          description: Voucher redeem code.
          schema:
            type: string
      responses:
        '200':
          description: The voucher.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Voucher'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Voucher not found or not owned by the member.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                status: false
                error:
                  code: NOT_FOUND
                  message: Voucher not found
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/v1/mobile/vouchers/claim:
    post:
      tags:
        - Mobile - Vouchers
      summary: Claim a printed voucher
      description: |
        Attaches an anonymous printed voucher (scanned from a paper receipt) to
        the member's account. Only a currently-anonymous, still-usable voucher
        (`Active` or `Issued`) can be claimed; re-claiming one's own voucher is
        idempotent. Redemption itself happens at the till, not here.
      operationId: mobileClaimVoucher
      security:
        - MobileBearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClaimVoucherRequest'
            example:
              code: "BUY-7K3M9QF2X1A4D8C0"
      responses:
        '200':
          description: The claimed voucher, now linked to the member.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Voucher'
        '400':
          description: Voucher is not claimable (used, expired, revoked) or code missing.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                status: false
                error:
                  code: VOUCHER_NOT_CLAIMABLE
                  message: Voucher is not claimable (used, expired, or revoked)
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Voucher code does not exist.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                status: false
                error:
                  code: VOUCHER_NOT_FOUND
                  message: Voucher not found
        '409':
          description: Voucher already claimed by another member.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                status: false
                error:
                  code: ALREADY_CLAIMED
                  message: Voucher already claimed by another member
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/v1/mobile/offers/campaigns:
    get:
      tags:
        - Mobile - Offers
      summary: List visible offer campaigns
      description: |
        Returns campaign cards for the member's current operating country
        (country-specific plus country-less campaigns). The app can use this
        response for the Home carousel and for a listing filter/selector.

        Visibility is controlled by the backend: only active campaigns whose
        publication window has started and whose validity has not expired are
        returned. Switch country with `PUT /me/country`.
      operationId: mobileListOfferCampaigns
      security:
        - MobileBearerAuth: []
      responses:
        '200':
          description: Visible offer campaigns.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OfferCampaignsResponse'
              example:
                campaigns:
                  - id: 101
                    title: Weekend specials
                    description: Offers valid this weekend
                    country: ie
                    image_url: /offers/media/campaign-image/101
                    leaflet_url: /offers/media/campaign-leaflet/101
                    valid_from: "2026-06-26"
                    valid_until: "2026-06-29"
                    offer_count: 12
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/v1/mobile/offers:
    get:
      tags:
        - Mobile - Offers
      summary: List visible offers and banners
      description: |
        Returns offers from currently-visible campaigns for the member's current
        operating country, plus active standalone banners for the same country
        (or country-less banners). Offers are ordered by campaign, priority
        descending, then title ascending.

        Use `limit`/`offset` for lazy loading. `total` is the unpaginated offer
        count. `campaign_id` limits the offer list to one visible campaign;
        banners are still returned for the listing page.
      operationId: mobileListOffers
      security:
        - MobileBearerAuth: []
      parameters:
        - name: campaign_id
          in: query
          required: false
          description: Optional visible campaign id to filter the offers list.
          schema:
            type: integer
            minimum: 1
        - name: limit
          in: query
          required: false
          description: >-
            Page size. Defaults to 12 and is capped at 100. Values below 1 fall
            back to the default rather than clamping, so a zero cannot be read as
            "no limit".
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 12
        - name: offset
          in: query
          required: false
          description: Pagination offset. Defaults to 0.
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        '200':
          description: Paginated offers and listing banners.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OffersResponse'
              example:
                offers:
                  - id: 501
                    campaign_id: 101
                    title: Polish dumplings
                    description: Frozen pierogi selection
                    weight: 450g
                    country: ie
                    image_url: /offers/media/offer-image/501
                    promotion_type:
                      code: discount
                      name: Discount
                      badge_url: /offers/media/promotion-badge/3
                    has_price: true
                    price:
                      text_1: now
                      value_1: "2.99"
                      text_2: was
                      value_2: "3.49"
                      unit: each
                    valid_from: "2026-06-26"
                    valid_until: "2026-06-29"
                  - id: 502
                    campaign_id: 101
                    title: Ask in store
                    description: Price available in store
                    weight: null
                    country: ie
                    image_url: /offers/media/offer-image/502
                    promotion_type: null
                    has_price: false
                    price: null
                    valid_from: "2026-06-26"
                    valid_until: "2026-06-29"
                banners:
                  - id: 301
                    name: Fresh bakery leaflet
                    country: null
                    image_url: /offers/media/banner-image/301
                    leaflet_url: /offers/media/banner-leaflet/301
                total: 24
                limit: 12
                offset: 0
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/v1/mobile/offers/{offer_id}:
    get:
      tags:
        - Mobile - Offers
      summary: Get a visible offer
      description: |
        Returns one offer if it belongs to a currently-visible campaign for the
        member's current operating country. Expired, unpublished, cross-country,
        or unknown offers return `404 NOT_FOUND`.
      operationId: mobileGetOffer
      security:
        - MobileBearerAuth: []
      parameters:
        - name: offer_id
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        '200':
          description: Offer detail.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OfferDetailResponse'
              example:
                offer:
                  id: 501
                  campaign_id: 101
                  title: Polish dumplings
                  description: Frozen pierogi selection
                  weight: 450g
                  country: ie
                  image_url: /offers/media/offer-image/501
                  promotion_type:
                    code: discount
                    name: Discount
                    badge_url: /offers/media/promotion-badge/3
                  has_price: true
                  price:
                    text_1: now
                    value_1: "2.99"
                    text_2: was
                    value_2: "3.49"
                    unit: each
                  valid_from: "2026-06-26"
                  valid_until: "2026-06-29"
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Offer not found or not currently visible.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                status: false
                error:
                  code: NOT_FOUND
                  message: Offer not found
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/v1/mobile/offers/media/{kind}/{id}:
    get:
      tags:
        - Mobile - Offers
      summary: Stream public offer media
      description: |
        Public image/PDF endpoint used by `image_url`, `leaflet_url`, and
        `badge_url` fields. The endpoint does not require a Bearer token because
        the assets are promotional, but it only serves whitelisted binary fields
        from currently-visible records. Unknown, empty, expired, unpublished, or
        inactive assets return 404.
      operationId: mobileGetOfferMedia
      parameters:
        - name: kind
          in: path
          required: true
          schema:
            type: string
            enum:
              - campaign-image
              - campaign-leaflet
              - offer-image
              - banner-image
              - banner-leaflet
              - promotion-badge
        - name: id
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        '200':
          description: Binary image or PDF stream.
          content:
            image/png:
              schema:
                type: string
                format: binary
            image/jpeg:
              schema:
                type: string
                format: binary
            application/pdf:
              schema:
                type: string
                format: binary
        '404':
          description: Media not found or not currently visible.

  /api/v1/mobile/stores:
    get:
      tags:
        - Mobile - Stores
      summary: List stores for the current country
      description: |
        Returns the active shops of the member's current operating country, both
        brands (Polonez and Eastore), ordered by name. Switch country with
        `PUT /me/country`. Coordinates power the map; `maps_url` is a fallback
        link. Opening hours are returned both as display text and structured
        weekly intervals for future "open now" filtering.

        Optional query filters support the mobile store-filter UI. `format` is a
        single-select filter (`all`, `polonez`, `eastore`). Boolean toggle filters
        only apply when enabled (`true`, `1`, `yes`, `on`); disabled/false/empty
        values are treated as no filter. Enabled filters are combined with AND.
      operationId: mobileListStores
      security:
        - MobileBearerAuth: []
      parameters:
        - name: format
          in: query
          required: false
          description: Brand/format filter. `all` or absent returns both brands.
          schema:
            type: string
            enum: [all, polonez, eastore]
            default: all
        - name: favorite
          in: query
          required: false
          description: Return only favourite stores when enabled. `favourite` alias is also accepted.
          schema:
            type: boolean
        - name: favourite
          in: query
          required: false
          deprecated: true
          description: British spelling alias for `favorite`.
          schema:
            type: boolean
        - name: has_off_licence
          in: query
          required: false
          description: Return only stores with off licence when enabled.
          schema:
            type: boolean
        - name: has_freshly_baked
          in: query
          required: false
          description: Return only stores with freshly baked products when enabled.
          schema:
            type: boolean
        - name: has_butchers
          in: query
          required: false
          description: Return only stores with butchers/fresh meat when enabled.
          schema:
            type: boolean
      responses:
        '200':
          description: Stores for the member's current country.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StoresResponse'
              example:
                stores:
                  - code: "ARTAN"
                    name: Artane
                    format: polonez
                    country: ie
                    has_off_licence: true
                    has_freshly_baked: true
                    has_butchers: false
                    is_favorite: false
                    address: "Artane, Unit 11 Butterfly, D05 C856, Ireland"
                    maps_url: "https://goo.gl/YRmd5Rom3WquTAnn7"
                    latitude: 53.3851
                    longitude: -6.21356
                    opening_hours_display: "Mon-Sat 10:00-20:00; Sun 11:00-19:00"
                    opening_hours_source: website
                    opening_hours:
                      timezone: Europe/Dublin
                      weekly:
                        mon:
                          - ["10:00", "20:00"]
                        tue:
                          - ["10:00", "20:00"]
                        wed:
                          - ["10:00", "20:00"]
                        thu:
                          - ["10:00", "20:00"]
                        fri:
                          - ["10:00", "20:00"]
                        sat:
                          - ["10:00", "20:00"]
                        sun:
                          - ["11:00", "19:00"]
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/v1/mobile/stores/{code}/favorite:
    parameters:
      - name: code
        in: path
        required: true
        description: Store code from `GET /stores`.
        schema:
          type: string
        example: ARTAN
    post:
      tags:
        - Mobile - Stores
      summary: Add or remove a favourite store
      description: |
        Idempotently sets the store favourite state for the authenticated member.
        When the body is omitted, the store is added to favourites. The endpoint
        is scoped to the member's current country; stores from another country
        return `404 NOT_FOUND`.
      operationId: mobileSetStoreFavorite
      security:
        - MobileBearerAuth: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StoreFavoriteRequest'
            example:
              favorite: true
      responses:
        '200':
          description: Updated store favourite state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StoreResponse'
              example:
                store:
                  code: ARTAN
                  name: Artane
                  format: polonez
                  country: ie
                  has_off_licence: true
                  has_freshly_baked: true
                  has_butchers: false
                  is_favorite: true
                  address: "Artane, Unit 11 Butterfly, D05 C856, Ireland"
                  maps_url: "https://goo.gl/YRmd5Rom3WquTAnn7"
                  latitude: 53.3851
                  longitude: -6.21356
                  opening_hours_display: "Mon-Sat 10:00-20:00; Sun 11:00-19:00"
                  opening_hours_source: website
                  opening_hours:
                    timezone: Europe/Dublin
                    weekly:
                      mon:
                        - ["10:00", "20:00"]
                      tue:
                        - ["10:00", "20:00"]
                      wed:
                        - ["10:00", "20:00"]
                      thu:
                        - ["10:00", "20:00"]
                      fri:
                        - ["10:00", "20:00"]
                      sat:
                        - ["10:00", "20:00"]
                      sun:
                        - ["11:00", "19:00"]
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    put:
      tags:
        - Mobile - Stores
      summary: Add or remove a favourite store
      description: Same semantics as `POST /stores/{code}/favorite`.
      operationId: mobilePutStoreFavorite
      security:
        - MobileBearerAuth: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StoreFavoriteRequest'
      responses:
        '200':
          description: Updated store favourite state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StoreResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    delete:
      tags:
        - Mobile - Stores
      summary: Remove a favourite store
      description: Idempotently removes the store from the member's favourites.
      operationId: mobileDeleteStoreFavorite
      security:
        - MobileBearerAuth: []
      responses:
        '200':
          description: Store after removal from favourites.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StoreResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

components:
  securitySchemes:
    MobileBearerAuth:
      type: http
      scheme: bearer
      bearerFormat: Mobile session token
      description: Token returned by `/auth/otp/verify` or `/auth/signup/complete`.

  parameters:
    CountryQueryParam:
      name: country
      in: query
      required: false
      description: >-
        Operating country to scope the response to (`ie` = Ireland, `ni` =
        Northern Ireland). Defaults to `ie` when absent or invalid.
      schema:
        $ref: '#/components/schemas/OperatingCountry'
      example: ie

  responses:
    BadRequest:
      description: Invalid request payload or business validation error.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            status: false
            error:
              code: INVALID_FIELD
              message: device_id is required
              details:
                field: device_id
    Unauthorized:
      description: |
        Missing, invalid, expired, or revoked mobile session token.

        Two error codes are possible and the app should treat them differently:

        - `UNAUTHORIZED` — generic. Drop to the unauthenticated flow silently.
        - `SESSION_REVOKED` — this device was signed out by the active-session
          limit, either after another login or during existing-session cleanup
          (see `/auth/otp/verify`). Clear the local token and tell the user why.

        In both cases the stored token must be discarded; only the message
        shown to the user differs.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            unauthorized:
              summary: Unknown, expired, or logged-out token
              value:
                status: false
                error:
                  code: UNAUTHORIZED
                  message: Invalid or expired session token
            sessionRevoked:
              summary: Signed out after another device logged in
              value:
                status: false
                error:
                  code: SESSION_REVOKED
                  message: Session was signed out because this account signed in on another device
            sessionLimitCleanup:
              summary: Signed out during existing-session cleanup
              value:
                status: false
                error:
                  code: SESSION_REVOKED
                  message: Session was signed out because this account had too many active devices
    Conflict:
      description: State conflict, for example email already verified or changed.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Requested record was not found or is not visible to the member.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            status: false
            error:
              code: NOT_FOUND
              message: Store not found
    LegalDocumentNotFound:
      description: Requested legal document is not published.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            status: false
            error:
              code: LEGAL_DOCUMENT_NOT_FOUND
              message: No published terms document
    RateLimit:
      description: Request rate limit reached.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            status: false
            error:
              code: OTP_RATE_LIMIT_REQUEST
              message: Too many requests, try again in a minute
              details:
                retry_after: 60
    InternalServerError:
      description: Unexpected server error.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            status: false
            error:
              code: INTERNAL_SERVER_ERROR
              message: Internal server error
    ServiceUnavailableError:
      description: Temporary delivery/provider failure.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            status: false
            error:
              code: OTP_DELIVERY_FAILED
              message: Could not send verification code, try again

  schemas:
    ErrorResponse:
      type: object
      required:
        - status
        - error
      properties:
        status:
          type: boolean
          example: false
        error:
          type: object
          required:
            - code
            - message
          properties:
            code:
              type: string
              example: INVALID_FIELD
            message:
              type: string
              example: device_id is required
            details:
              type: object
              additionalProperties: true

    MobileConfigResponse:
      type: object
      required:
        - welcome_voucher
        - legal
        - countries
        - genders
      properties:
        welcome_voucher:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/WelcomeVoucher'
        legal:
          type: object
          required:
            - terms
            - privacy
          properties:
            terms:
              nullable: true
              allOf:
                - $ref: '#/components/schemas/LegalVersion'
            privacy:
              nullable: true
              allOf:
                - $ref: '#/components/schemas/LegalVersion'
        countries:
          type: array
          items:
            $ref: '#/components/schemas/Option'
        genders:
          type: array
          items:
            $ref: '#/components/schemas/Option'

    WelcomeVoucher:
      type: object
      required:
        - discount_cents
        - min_purchase_cents
        - currency
        - label
      properties:
        discount_cents:
          type: integer
          example: 500
        min_purchase_cents:
          type: integer
          example: 2500
        currency:
          $ref: '#/components/schemas/Currency'
        label:
          type: string
          example: "€5 off €25"

    LegalVersion:
      type: object
      required:
        - version
      properties:
        version:
          type: string
          example: "2026-06-draft"

    Option:
      type: object
      required:
        - value
        - label
      properties:
        value:
          type: string
        label:
          type: string

    LegalDocument:
      type: object
      required:
        - doc_type
        - title
        - version
        - body_html
      properties:
        doc_type:
          type: string
          enum:
            - terms
            - privacy
        title:
          type: string
        version:
          type: string
        body_html:
          type: string
          description: HTML rendered as-is by the mobile app.
        updated_at:
          type: string
          format: date-time
          nullable: true

    OtpRequest:
      type: object
      required:
        - country
        - phone
      properties:
        country:
          $ref: '#/components/schemas/PhoneCountry'
        phone:
          type: string
          description: National or international phone number. Separators are allowed.
          example: "083 054 0215"

    PhoneCountry:
      type: string
      enum:
        - ie
        - ni
      description: "`ie` = Ireland (+353), `ni` = Northern Ireland (+44)."

    OperatingCountry:
      type: string
      enum:
        - ie
        - ni
      description: >-
        Operating country that scopes a member's balance, vouchers, shops and
        legal documents. `ie` = Ireland (EUR), `ni` = Northern Ireland (GBP).
        Distinct from `country_of_origin` (nationality).

    Currency:
      type: string
      enum:
        - EUR
        - GBP
      description: Currency of the operating country (IE→EUR, NI→GBP).

    SetCountryRequest:
      type: object
      required:
        - country
      properties:
        country:
          $ref: '#/components/schemas/OperatingCountry'

    OfferCampaignsResponse:
      type: object
      required:
        - campaigns
      properties:
        campaigns:
          type: array
          items:
            $ref: '#/components/schemas/OfferCampaign'

    OfferCampaign:
      type: object
      required:
        - id
        - title
        - description
        - country
        - image_url
        - leaflet_url
        - valid_from
        - valid_until
        - offer_count
      properties:
        id:
          type: integer
          example: 101
        title:
          type: string
          example: Weekend specials
        description:
          type: string
          nullable: true
          example: Offers valid this weekend
        country:
          type: string
          nullable: true
          enum: [ie, ni]
          description: Null means visible in both operating countries.
        image_url:
          type: string
          nullable: true
          description: Mobile-relative URL for the campaign image.
          example: /offers/media/campaign-image/101
        leaflet_url:
          type: string
          nullable: true
          description: Mobile-relative URL for the optional campaign PDF leaflet.
          example: /offers/media/campaign-leaflet/101
        valid_from:
          type: string
          format: date
          nullable: true
        valid_until:
          type: string
          format: date
          nullable: true
        offer_count:
          type: integer
          example: 12

    OffersResponse:
      type: object
      required:
        - offers
        - banners
        - total
        - limit
        - offset
      properties:
        offers:
          type: array
          items:
            $ref: '#/components/schemas/Offer'
        banners:
          type: array
          items:
            $ref: '#/components/schemas/OfferBanner'
        total:
          type: integer
          description: Unpaginated number of visible offers matching the filter.
          example: 24
        limit:
          type: integer
          example: 12
        offset:
          type: integer
          example: 0

    OfferDetailResponse:
      type: object
      required:
        - offer
      properties:
        offer:
          $ref: '#/components/schemas/Offer'

    Offer:
      type: object
      required:
        - id
        - campaign_id
        - title
        - description
        - weight
        - country
        - image_url
        - promotion_type
        - has_price
        - price
        - valid_from
        - valid_until
      properties:
        id:
          type: integer
          example: 501
        campaign_id:
          type: integer
          example: 101
        title:
          type: string
          example: Polish dumplings
        description:
          type: string
          nullable: true
        weight:
          type: string
          nullable: true
          example: 450g
        country:
          type: string
          nullable: true
          enum: [ie, ni]
          description: Null means visible in both operating countries.
        image_url:
          type: string
          nullable: true
          example: /offers/media/offer-image/501
        promotion_type:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/OfferPromotionType'
        has_price:
          type: boolean
          description: When false, `price` is null and the app should show the in-store price fallback.
        price:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/OfferPrice'
        valid_from:
          type: string
          format: date
          nullable: true
        valid_until:
          type: string
          format: date
          nullable: true

    OfferPrice:
      type: object
      required:
        - text_1
        - value_1
        - text_2
        - value_2
        - unit
      properties:
        text_1:
          type: string
          nullable: true
          example: now
        value_1:
          type: string
          nullable: true
          example: "2.99"
        text_2:
          type: string
          nullable: true
          example: was
        value_2:
          type: string
          nullable: true
          example: "3.49"
        unit:
          type: string
          nullable: true
          example: each

    OfferPromotionType:
      type: object
      required:
        - code
        - name
        - badge_url
      properties:
        code:
          type: string
          example: discount
        name:
          type: string
          example: Discount
        badge_url:
          type: string
          nullable: true
          example: /offers/media/promotion-badge/3

    OfferBanner:
      type: object
      required:
        - id
        - name
        - country
        - image_url
        - leaflet_url
      properties:
        id:
          type: integer
          example: 301
        name:
          type: string
          nullable: true
          example: Fresh bakery leaflet
        country:
          type: string
          nullable: true
          enum: [ie, ni]
          description: Null means visible in both operating countries.
        image_url:
          type: string
          nullable: true
          example: /offers/media/banner-image/301
        leaflet_url:
          type: string
          nullable: true
          example: /offers/media/banner-leaflet/301

    StoresResponse:
      type: object
      required:
        - stores
      properties:
        stores:
          type: array
          items:
            $ref: '#/components/schemas/Store'

    StoreResponse:
      type: object
      required:
        - store
      properties:
        store:
          $ref: '#/components/schemas/Store'

    StoreFavoriteRequest:
      type: object
      properties:
        favorite:
          type: boolean
          description: Desired favourite state. Omit body to add the store.
          default: true
        favourite:
          type: boolean
          deprecated: true
          description: British spelling alias for `favorite`.

    Store:
      type: object
      required:
        - code
        - name
        - format
        - country
        - has_off_licence
        - has_freshly_baked
        - has_butchers
        - has_hot_dog
        - is_favorite
        - address
        - maps_url
        - latitude
        - longitude
        - opening_hours_display
        - opening_hours_source
        - opening_hours
      properties:
        code:
          type: string
          description: 5-char shop identifier (same as POS shop_id).
          example: "ARTAN"
        name:
          type: string
          example: Artane
        format:
          type: string
          enum: [polonez, eastore]
          description: Store brand/format.
        country:
          $ref: '#/components/schemas/OperatingCountry'
        has_off_licence:
          type: boolean
          description: Whether the store has an off licence.
          example: true
        has_freshly_baked:
          type: boolean
          description: Whether the store offers freshly baked products.
          example: true
        has_butchers:
          type: boolean
          description: Whether the store has butchers/fresh meat.
          example: false
        has_hot_dog:
          type: boolean
          description: Whether the store has a hot dog counter.
          example: false
        is_favorite:
          type: boolean
          description: Whether this store is in the member's favourites.
          example: false
        address:
          type: string
          nullable: true
          example: "Artane, Unit 11 Butterfly, D05 C856, Ireland"
        maps_url:
          type: string
          nullable: true
          description: Google Maps link; fallback when coordinates are unavailable.
        latitude:
          type: number
          format: double
          nullable: true
          example: 53.3851
        longitude:
          type: number
          format: double
          nullable: true
          example: -6.21356
        opening_hours_display:
          type: string
          nullable: true
          description: Human-readable schedule for direct display in the app.
          example: "Mon-Sat 10:00-20:00; Sun 11:00-19:00"
        opening_hours_source:
          type: string
          nullable: true
          enum: [website, default, manual]
          description: |
            Source of the stored schedule. `default` means no store-specific
            opening hours were found and the default schedule is used.
        opening_hours:
          $ref: '#/components/schemas/StoreOpeningHours'

    StoreOpeningHours:
      type: object
      required:
        - timezone
        - weekly
      properties:
        timezone:
          type: string
          nullable: true
          description: IANA timezone derived from store country.
          example: Europe/Dublin
        weekly:
          type: object
          required:
            - mon
            - tue
            - wed
            - thu
            - fri
            - sat
            - sun
          properties:
            mon:
              $ref: '#/components/schemas/StoreOpeningIntervals'
            tue:
              $ref: '#/components/schemas/StoreOpeningIntervals'
            wed:
              $ref: '#/components/schemas/StoreOpeningIntervals'
            thu:
              $ref: '#/components/schemas/StoreOpeningIntervals'
            fri:
              $ref: '#/components/schemas/StoreOpeningIntervals'
            sat:
              $ref: '#/components/schemas/StoreOpeningIntervals'
            sun:
              $ref: '#/components/schemas/StoreOpeningIntervals'

    StoreOpeningIntervals:
      type: array
      description: Zero or more opening intervals for one weekday.
      items:
        type: array
        minItems: 2
        maxItems: 2
        items:
          type: string
          pattern: '^\d{2}:\d{2}$'
        example: ["10:00", "20:00"]

    OtpRequestResponse:
      type: object
      required:
        - expires_in
        - retry_after
      properties:
        expires_in:
          type: integer
          description: OTP TTL in seconds.
          example: 300
        retry_after:
          type: integer
          description: Recommended wait time before requesting another code.
          example: 60

    OtpVerifyRequest:
      type: object
      required:
        - country
        - phone
        - code
        - device_id
        - platform
      properties:
        country:
          $ref: '#/components/schemas/PhoneCountry'
        phone:
          type: string
          example: "879991001"
        code:
          type: string
          pattern: '^\d{6}$'
          example: "654321"
        device_id:
          type: string
          description: Stable app/device identifier generated by the mobile app.
        platform:
          $ref: '#/components/schemas/Platform'
        device_name:
          type: string
          nullable: true
        app_version:
          type: string
          nullable: true

    Platform:
      type: string
      enum:
        - ios
        - android

    AuthenticatedResponse:
      type: object
      required:
        - status
        - token
        - expires_at
        - partner_id
        - is_profile_complete
      properties:
        status:
          type: string
          enum:
            - authenticated
        token:
          type: string
          description: Bearer token for authenticated mobile endpoints.
          example: "est_XI3ZmjHz0bnrybRr4uQGmBMlpPmAycGl3urc-opGdsA"
        expires_at:
          type: string
          format: date-time
        partner_id:
          type: integer
        is_profile_complete:
          type: boolean

    SignupRequiredResponse:
      type: object
      required:
        - status
        - signup_token
        - signup_expires_in
      properties:
        status:
          type: string
          enum:
            - signup_required
        signup_token:
          type: string
          example: "sst_9wK3s6vtE7r4m3Y8pQ"
        signup_expires_in:
          type: integer
          description: Signup token TTL in seconds.

    SignupCompleteRequest:
      type: object
      required:
        - signup_token
        - first_name
        - terms_accepted
        - device_id
        - platform
      properties:
        signup_token:
          type: string
          description: Token returned by `/auth/otp/verify` when status is `signup_required`.
          example: "sst_9wK3s6vtE7r4m3Y8pQ"
        first_name:
          type: string
          maxLength: 100
        terms_accepted:
          type: boolean
          description: Must be true.
        device_id:
          type: string
        platform:
          $ref: '#/components/schemas/Platform'
        device_name:
          type: string
          nullable: true
        app_version:
          type: string
          nullable: true

    Profile:
      type: object
      required:
        - partner_id
        - first_name
        - last_name
        - phone
        - email
        - date_of_birth
        - country_of_origin
        - current_country
        - gender
        - is_authenticated
        - is_phone_verified
        - is_email_verified
        - is_profile_complete
        - staff_discount
        - permissions
      properties:
        partner_id:
          type: integer
        first_name:
          type: string
          nullable: true
        last_name:
          type: string
          nullable: true
        phone:
          type: string
          nullable: true
          example: "+353879991001"
        email:
          type: string
          format: email
          nullable: true
        date_of_birth:
          type: string
          format: date
          nullable: true
        country_of_origin:
          type: string
          nullable: true
          description: Member nationality (demographic); distinct from current_country.
          example: ireland
        current_country:
          allOf:
            - $ref: '#/components/schemas/OperatingCountry'
          description: >-
            Operating country (IE/NI). Set from the phone prefix at signup,
            switchable via PUT /me/country. Scopes balance, vouchers and legal.
          example: ie
        gender:
          type: string
          nullable: true
          enum:
            - male
            - female
            - non_binary
            - prefer_not_to_say
        is_authenticated:
          type: boolean
          example: true
        is_phone_verified:
          type: boolean
        is_email_verified:
          type: boolean
        is_profile_complete:
          type: boolean
        staff_discount:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/StaffDiscount'
          description: >-
            Read-only Staff Discount block shown in Account details (SO20-2476).
            An object with the discount percent for members who currently hold
            the staff role; `null` for regular customers, which hides the block
            entirely. The value cannot be entered or edited by the user — it is
            not accepted by PATCH /me. Removing the staff role turns this back to
            `null` on the next fetch.
        permissions:
          $ref: '#/components/schemas/ProfilePermissions'

    StaffDiscount:
      type: object
      required:
        - percent
      properties:
        percent:
          type: integer
          minimum: 0
          maximum: 100
          description: Current staff discount rate applied at the till, in percent.
          example: 10

    ProfilePermissions:
      type: object
      required:
        - can_browse_offers
        - can_use_card
        - can_earn_points
        - can_spend_points
        - can_redeem_vouchers
      properties:
        can_browse_offers:
          type: boolean
        can_use_card:
          type: boolean
        can_earn_points:
          type: boolean
        can_spend_points:
          type: boolean
        can_redeem_vouchers:
          type: boolean

    ProfilePatchRequest:
      type: object
      minProperties: 1
      additionalProperties: false
      properties:
        first_name:
          type: string
          maxLength: 100
        last_name:
          type: string
          maxLength: 100
        email:
          type: string
          format: email
        phone:
          type: string
          description: Must already match the current phone; phone changes require OTP.
          pattern: '^\+(353|44)\d{6,12}$'
        date_of_birth:
          type: string
          format: date
        country_of_origin:
          type: string
          description: One of the `countries[].value` entries from `/config`.
        gender:
          type: string
          nullable: true
          enum:
            - male
            - female
            - non_binary
            - prefer_not_to_say

    MobileApplication:
      type: string
      enum:
        - eastore
        - polonez

    PreferencesResponse:
      type: object
      required:
        - application
        - push_notifications
        - email_newsletter
        - receive_sms
        - is_profile_verified
      properties:
        application:
          $ref: '#/components/schemas/MobileApplication'
        push_notifications:
          type: boolean
          description: Account preference; target-device OS permission is checked separately.
          default: true
        email_newsletter:
          type: boolean
          default: false
        receive_sms:
          type: boolean
          default: false
        is_profile_verified:
          type: boolean
          description: False means email newsletter and SMS cannot be enabled.

    PreferencesPatchRequest:
      type: object
      minProperties: 1
      additionalProperties: false
      properties:
        push_notifications:
          type: boolean
        email_newsletter:
          type: boolean
        receive_sms:
          type: boolean

    DeleteProfileResponse:
      type: object
      required:
        - deleted
      properties:
        deleted:
          type: boolean
        deleted_at:
          type: string
          format: date-time
          nullable: true

    EmailVerificationRequestResponse:
      type: object
      required:
        - expires_in
        - retry_after
      properties:
        expires_in:
          type: integer
          example: 86400
        retry_after:
          type: integer
          example: 60

    EmailVerificationVerifyRequest:
      type: object
      required:
        - code
      properties:
        code:
          type: string
          pattern: '^\d{6}$'
          example: "123456"

    EmailVerificationVerifyResponse:
      type: object
      required:
        - is_email_verified
        - is_profile_complete
      properties:
        is_email_verified:
          type: boolean
        is_profile_complete:
          type: boolean

    CardResponse:
      type: object
      required:
        - card_code
        - points_balance
        - currency
        - points_conversion
        - qr_tokens
      properties:
        card_code:
          type: string
          nullable: true
          description: Stable 16-digit member card number; country-independent identity.
          example: "3806868525361001"
        points_balance:
          type: integer
          description: Points balance for the member's current country.
          example: 0
        currency:
          $ref: '#/components/schemas/Currency'
        points_conversion:
          allOf:
            - $ref: '#/components/schemas/PointsConversion'
          description: >-
            Progress toward the next automatic point conversion: the minimum
            balance required, points still missing, the balance value in money,
            and the next globally planned conversion date.
        qr_tokens:
          type: array
          items:
            $ref: '#/components/schemas/QrToken'

    PointsConversion:
      type: object
      required:
        - minimum_points
        - points_remaining
        - points_balance_value_cents
        - next_conversion_date
        - currency
      properties:
        minimum_points:
          type: integer
          minimum: 1
          description: >-
            Minimum wallet balance required before any conversion runs
            (fixed at 400 points = EUR 4).
          example: 400
        points_remaining:
          type: integer
          minimum: 0
          description: Points still needed to reach the conversion minimum.
          example: 150
        points_balance_value_cents:
          type: integer
          minimum: 0
          description: >-
            Current points balance expressed in minor currency units
            (100 points = EUR 1, so one point equals one cent/penny).
          example: 250
        next_conversion_date:
          type: string
          format: date
          nullable: true
          description: >-
            Closest active planned conversion date that is today or later. The
            date is global and identical for IE and NI. Conversion runs
            automatically at 00:00 on that date; null when no future date is
            planned.
          example: "2026-08-01"
        currency:
          $ref: '#/components/schemas/Currency'

    QrToken:
      type: object
      required:
        - business_date
        - valid_from
        - valid_until
        - qr_payload
      properties:
        business_date:
          type: string
          format: date
          example: "2026-06-11"
        valid_from:
          type: string
          format: date-time
        valid_until:
          type: string
          format: date-time
        qr_payload:
          type: string
          example: "lq1.20260611.FQIMFTM5GZNVQU..."

    PointsHistoryResponse:
      type: object
      required:
        - items
        - next_cursor
        - has_more
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/WalletHistoryEntry'
        next_cursor:
          type: string
          nullable: true
          description: Cursor for the next page; null on the last page.
        has_more:
          type: boolean
          description: Whether another page exists.

    WalletHistoryEntry:
      type: object
      required:
        - id
        - type
        - occurred_at
        - points
        - currency
        - store
        - amount_cents
        - receipt
        - note
        - vouchers_used
        - vouchers_earned
      properties:
        id:
          type: integer
          description: Stable row key. Use this for list identity, not `receipt`.
          example: 982
        type:
          $ref: '#/components/schemas/WalletHistoryEntryType'
        occurred_at:
          type: string
          format: date-time
          nullable: true
          description: |
            UTC. For a purchase this is the till receipt time, not when the till's
            call reached the server. For a conversion it is the date Head Office
            scheduled - a run delayed by downtime still reports the scheduled date,
            and several missed dates collapse into one entry dated by the latest of
            them. An immediate conversion triggered by an administrator has no
            scheduled date and reports the day it ran.
          example: "2026-02-28T10:32:00Z"
        points:
          type: integer
          description: |
            Signed: positive when earned, negative when debited, 0 for a visit
            that earned nothing.
          example: 90
        currency:
          $ref: '#/components/schemas/Currency'
        store:
          allOf:
            - $ref: '#/components/schemas/WalletHistoryStore'
          nullable: true
          description: Null when the event is not tied to a till (conversions, adjustments).
        amount_cents:
          type: integer
          nullable: true
          description: Basket total in minor units. Null for non-purchase rows.
          example: 9000
        receipt:
          type: string
          nullable: true
          description: Receipt number printed at the till. Null for non-purchase rows.
          example: "000123"
        note:
          type: string
          nullable: true
          description: Reason text, present on manual adjustments.
        vouchers_used:
          type: array
          description: Vouchers the member spent on this purchase.
          items:
            $ref: '#/components/schemas/WalletHistoryVoucher'
        vouchers_earned:
          type: array
          description: |
            Vouchers this event handed out - issued at the till for a purchase,
            or minted by the debit for a conversion.
          items:
            $ref: '#/components/schemas/WalletHistoryVoucher'

    WalletHistoryEntryType:
      type: string
      enum:
        - purchase
        - conversion
        - adjustment
      description: |
        `purchase` - a till visit; `conversion` - Head Office turned points into
        vouchers (always a debit); `adjustment` - a manual back-office correction.

    WalletHistoryStore:
      type: object
      required:
        - code
        - name
        - format
      properties:
        code:
          type: string
          example: BLANC
        name:
          type: string
          nullable: true
          description: Null when the till never resolved to a known shop record.
          example: Blanchardstown
        format:
          type: string
          nullable: true
          enum:
            - polonez
            - eastore
            - null
      example:
        code: BLANC
        name: Blanchardstown
        format: eastore

    WalletHistoryVoucher:
      type: object
      required:
        - code
        - description
        - discount_cents
      properties:
        code:
          type: string
          example: PLN-5OFF-4821
        description:
          type: string
          nullable: true
          example: EUR 5 off EUR 25
        discount_cents:
          type: integer
          example: 500

    LogoutResponse:
      type: object
      required:
        - revoked
      properties:
        revoked:
          type: boolean

    Voucher:
      type: object
      required:
        - code
        - type
        - status
        - description
        - discount_cents
        - min_purchase_cents
        - currency
        - valid_from
        - valid_until
        - received_at
        - redeemed_at
        - receipt
        - qr_code_payload
        - printed
      properties:
        code:
          type: string
          example: "BUY-7K3M9QF2X1A4D8C0"
        type:
          type: string
          enum: [welcome, birthday, x_off_y, individual]
        status:
          type: string
          enum: [Issued, Active, Used, Expired, Revoked]
        description:
          type: string
          example: "Voucher 5 off 25"
        discount_cents:
          type: integer
          example: 500
        min_purchase_cents:
          type: integer
          example: 2500
        currency:
          $ref: '#/components/schemas/Currency'
        valid_from:
          type: string
          nullable: true
          description: >-
            Start of the validity window as a store-local calendar boundary
            (`YYYY-MM-DDT00:00:00`, no timezone). It is a calendar day, not a
            UTC instant — the till evaluates validity on the local date.
          example: "2026-06-16T00:00:00"
        valid_until:
          type: string
          nullable: true
          description: >-
            End of the validity window as a store-local calendar boundary
            (`YYYY-MM-DDT23:59:59`, no timezone).
          example: "2026-06-30T23:59:59"
        received_at:
          type: string
          format: date-time
          nullable: true
          description: When the voucher was issued.
        redeemed_at:
          type: string
          format: date-time
          nullable: true
          description: When the voucher was redeemed at the till; null if unused.
        receipt:
          type: string
          nullable: true
          description: Receipt number the voucher was redeemed on; null if unused.
        qr_code_payload:
          type: string
          description: Payload to render as a QR for scanning at the till (equals the code).
        printed:
          type: boolean
          description: True for anonymous receipt vouchers; false for member-owned ones.

    VoucherListResponse:
      type: object
      required:
        - vouchers
      properties:
        vouchers:
          type: array
          items:
            $ref: '#/components/schemas/Voucher'

    ClaimVoucherRequest:
      type: object
      required:
        - code
      properties:
        code:
          type: string
          description: The printed voucher code scanned from a paper receipt.
          example: "BUY-7K3M9QF2X1A4D8C0"

    SessionsResponse:
      type: object
      required:
        - sessions
      properties:
        sessions:
          type: array
          items:
            $ref: '#/components/schemas/MobileSession'

    MobileSession:
      type: object
      required:
        - id
        - device_id
        - platform
        - created_at
        - last_used_at
        - expires_at
        - is_current
      properties:
        id:
          type: integer
        device_id:
          type: string
        device_name:
          type: string
          nullable: true
        platform:
